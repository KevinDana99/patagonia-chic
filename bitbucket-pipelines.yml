options:
  docker: true

definitions:
  steps:
    - step: &push-gcp
        name: Build and Push to GCP registry
        image: google/cloud-sdk:alpine
        script:
          - apk add --update alpine-sdk nodejs npm
          - npm i -g yarn
          - yarn
          - yarn build-storybook
          - echo $GCLOUD_API_KEYFILE > /tmp/gcloud-api-key.json
          - gcloud auth activate-service-account --key-file /tmp/gcloud-api-key.json
          - gcloud config set project $GCLOUD_PROJECT
          - cat /tmp/gcloud-api-key.json | docker login -u _json_key --password-stdin https://gcr.io
          - make get-image
          - make snapshot
    - step: &merge-step
        name: Update k8s repo with new images and replicas
        image: alpine:edge
        script:
          - apk add --update alpine-sdk
          - apk add yq --repository=http://dl-cdn.alpinelinux.org/alpine/edge/community
          - apk add git openssh
          - echo "About to execute script"
          - ./src/utils/scripts/merge-spec-editor.sh
    - step: &publish-npm-package
        name: Publish NPM package
        image: node:16-alpine
        script:
          - .src/utils/scripts/npm-publish.sh

pipelines:
  branches:
    master:
      - step: *push-gcp
      - step: *merge-step
      - step: *publish-npm-package
    develop:
      - step: *push-gcp
      - step: *merge-step
    add-publish-to-ci:
      - step: *publish-npm-package
